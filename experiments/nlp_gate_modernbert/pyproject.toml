[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-gate-modernbert"
version = "0.2.0"
description = "WellPlot NLP Runtime V2 — MB-02 deterministic resolver / fact projector"
readme = "README.md"
requires-python = ">=3.11"
# No torch/transformers/encoder deps (MB-03 not justified).
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
