[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-gate-modernbert"
version = "0.1.0"
description = "WellPlot NLP Runtime V2 — encoder gate experiment (MB-01 corpus audit)"
readme = "README.md"
requires-python = ">=3.11"
# No torch/transformers/encoder deps until MB-03 authority.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
