version: 1
form_defaults:
  - id: normal
    kind: normal
    default_width_mm: 28.0
  - id: reference
    kind: reference
    default_width_mm: 16.0
  - id: array
    kind: array
    default_width_mm: 28.0
  - id: annotation
    kind: annotation
    default_width_mm: 28.0

track_archetypes:
  - id: reference_depth
    label: Reference Depth
    kind: reference
    default_width_mm: 16.0
    recommended_channels:
      - DEPT
      - DEPTH
      - MD
    notes: Shared depth axis, markers, and event context.
  - id: gamma_ray
    label: Gamma Ray
    kind: normal
    default_width_mm: 28.0
    recommended_channels:
      - GR
      - SGR
      - CGR
    recommended_binding:
      scale:
        kind: linear
        min: 0.0
        max: 150.0
      style:
        color: '#008000'
    notes: Single-curve scalar track for GR review.
  - id: porosity_overlay
    label: Porosity Overlay
    kind: normal
    default_width_mm: 32.0
    recommended_channels:
      - NPHI
      - RHOB
    notes: Dual-curve porosity track, often followed by crossover fill edits.
  - id: resistivity_log
    label: Resistivity
    kind: normal
    default_width_mm: 28.0
    recommended_channels:
      - RT
      - RESD
      - RDEP
      - ILD
      - AT90
      - RMED
      - ILM
      - AT60
      - RS
      - RSH
      - RXO
      - AT30
      - MSFL
    recommended_track_patch:
      x_scale:
        kind: log
        minimum: 0.2
        maximum: 2000.0
      grid:
        vertical_main_scale: logarithmic
        vertical_main_spacing_mode: scale
        vertical_secondary_scale: logarithmic
        vertical_secondary_spacing_mode: scale
    recommended_binding:
      scale:
        kind: log
        min: 0.2
        max: 2000.0
    notes: Scalar resistivity track with logarithmic scale.
  - id: vdl_array
    label: VDL Array
    kind: array
    default_width_mm: 28.0
    recommended_channels:
      - VDL
    recommended_binding:
      profile: vdl
      style:
        colormap: gray_r
    notes: Array/raster track for waveform-style VDL presentation.

style_presets:
  - family: porosity_overlays
    id: density_neutron_overlay
    label: Density-Neutron Overlay
    summary: Balanced overlay style for RHOB/NPHI porosity review.
    use_cases:
      - porosity
      - density-neutron
      - overlay
    track_patch:
      kind: normal
      width_mm: 32.0
      grid:
        display: true
        vertical:
          secondary:
            line_count: 4
    channel_families:
      bulk_density:
        - RHOB
        - RHOZ
        - ZDEN
        - DEN
      neutron_porosity:
        - NPHI
        - TNPH
        - NPL
    binding_templates:
      - alias_id: bulk_density
        label: Density
        label_template: '{label} ({channel})'
        scale:
          kind: linear
          min: 1.95
          max: 2.95
        style:
          color: '#c2410c'
          line_width: 1.3
      - alias_id: neutron_porosity
        label: Neutron
        label_template: '{label} ({channel})'
        scale:
          kind: linear
          min: 0.45
          max: -0.15
        scale_variants:
          - id: percentage_porosity
            when:
              value_abs_max_gt: 2.0
            scale:
              kind: linear
              min: 45.0
              max: -15.0
        style:
          color: '#1d4ed8'
          line_width: 1.1
        fill:
          kind: between_instances
          other_channel: RHOB
          label: Gas Crossover
          color: '#d1d5db'
          alpha: 0.18
          crossover:
            enabled: true
            left_color: '#bfdbfe'
            right_color: '#fed7aa'
            alpha: 0.28
    notes:
      - Use one shared track for RHOB and NPHI.
      - Reverse the neutron scale so low porosity plots to the right.
      - Prefer add_curve_fill(kind='between_instances', other_channel='RHOB') for crossover fill.
  - family: gr_sp_overviews
    id: gr_sp_overview
    agent_recovery_only: true
    label: GR/SP Overview
    summary: Conventional independent GR and SP scales on one overview track.
    use_cases:
      - gr/sp
      - gamma ray
      - spontaneous potential
      - overview
    track_patch:
      kind: normal
      width_mm: 32.0
      grid:
        display: true
    channel_families:
      gamma_ray:
        - GR
        - SGR
        - CGR
      spontaneous_potential:
        - SP
    binding_templates:
      - alias_id: gamma_ray
        label: Gamma Ray
        label_template: '{label} ({channel})'
        scale:
          kind: linear
          min: 0.0
          max: 150.0
        style:
          color: '#166534'
          line_width: 1.2
      - alias_id: spontaneous_potential
        label: Spontaneous Potential
        label_template: '{label} ({channel})'
        scale:
          kind: linear
          min: -80.0
          max: 20.0
        style:
          color: '#dc2626'
          line_width: 1.0
    notes:
      - Keep GR and SP on independent linear scales in one shared overview track.
      - Omit SP cleanly when the source does not provide it.
  - family: gamma_ray_defaults
    id: gamma_ray_clean_print
    label: Gamma Ray Clean Print
    summary: Single-curve gamma ray styling with strong print contrast.
    use_cases:
      - gamma ray
      - gr
      - print-safe
    track_patch:
      kind: normal
      width_mm: 28.0
      grid:
        display: true
    channel_families:
      gamma_ray:
        - GR
        - SGR
        - CGR
    binding_templates:
      - alias_id: gamma_ray
        label: Gamma Ray
        label_template: '{label} ({channel})'
        scale:
          kind: linear
          min: 0.0
          max: 150.0
        style:
          color: '#166534'
          line_width: 1.2
        header_display:
          scale_text_color: '#166534'
    notes:
      - Good default for single-track GR review.
      - Keeps the scale conventional and readable on grayscale printouts.
  - family: resistivity_log_conventions
    id: triple_combo_resistivity
    label: Triple Combo Resistivity
    summary: Log-scale resistivity convention for shallow/medium/deep overlays.
    use_cases:
      - resistivity
      - deep resistivity
      - triple combo
    track_patch:
      kind: normal
      width_mm: 32.0
      x_scale:
        kind: log
        min: 0.2
        max: 2000.0
      grid:
        display: true
        horizontal:
          display: true
        vertical:
          main:
            scale: logarithmic
            spacing_mode: scale
          secondary:
            scale: logarithmic
            spacing_mode: scale
    channel_families:
      shallow_resistivity:
        - RS
        - RSH
        - RXO
        - AT30
        - MSFL
      medium_resistivity:
        - RMED
        - ILM
        - AT60
      deep_resistivity:
        - RT
        - RESD
        - RDEP
        - ILD
        - AT90
    binding_templates:
      - alias_id: shallow_resistivity
        label: RSH
        label_template: '{label} ({channel})'
        scale:
          kind: log
          min: 0.2
          max: 2000.0
        style:
          color: '#dc2626'
          line_width: 0.9
          line_style: ':'
      - alias_id: medium_resistivity
        label: RME
        label_template: '{label} ({channel})'
        scale:
          kind: log
          min: 0.2
          max: 2000.0
        style:
          color: '#16a34a'
          line_width: 1.0
      - alias_id: deep_resistivity
        label: RDEEP
        label_template: '{label} ({channel})'
        scale:
          kind: log
          min: 0.2
          max: 2000.0
        style:
          color: '#111827'
          line_width: 1.3
    notes:
      - Keep all resistivity curves on the same logarithmic scale.
      - Use the deepest investigation curve with the strongest visual weight.
      - Use a red dotted shallow curve and a conventional green medium curve.
  - family: cbl_vdl_variants
    id: cbl_vdl_high_contrast
    label: CBL/VDL High Contrast
    summary: High-contrast CBL/VDL presentation for screen review.
    use_cases:
      - cbl
      - vdl
      - cement bond
      - waveform
    channel_families:
      cement_bond:
        - CBL
        - CBLF
      variable_density_log:
        - VDL
    binding_templates:
      - alias_id: cement_bond
        label: CBL
        scale:
          kind: linear
          min: 0.0
          max: 100.0
        style:
          color: '#111827'
          line_width: 1.3
      - alias_id: variable_density_log
        label: VDL
        render_mode: raster
        style:
          colormap: gray_r
    notes:
      - Use a dark scalar CBL curve against an inverted grayscale VDL raster.
      - Intended for screen-first diagnostics and anomaly review.
  - family: cbl_vdl_variants
    id: cbl_vdl_print_safe
    label: CBL/VDL Print Safe
    summary: Print-oriented CBL/VDL styling with restrained grayscale choices.
    use_cases:
      - cbl
      - vdl
      - print-safe
    channel_families:
      cement_bond:
        - CBL
        - CBLF
      variable_density_log:
        - VDL
    binding_templates:
      - alias_id: cement_bond
        label: CBL
        scale:
          kind: linear
          min: 0.0
          max: 100.0
        style:
          color: '#374151'
          line_width: 1.2
      - alias_id: variable_density_log
        label: VDL
        render_mode: raster
        style:
          colormap: Greys
    notes:
      - Avoids overly dark fills that collapse in office printers.
      - Prefer this preset when the main artifact will be PDF or paper.
  - family: report_page_styles
    id: report_header_clean
    label: Report Header Clean
    summary: Cleaner first page with fewer title rows and restrained remarks.
    use_cases:
      - header
      - report page
      - clean presentation
    heading_patch:
      service_titles:
        - value: Primary Interpretation
          alignment: left
          bold: true
    remarks_patch:
      - title: Notes
        lines:
          - Condense first-page commentary to one short block.
        alignment: left
    notes:
      - Good fit when the plot should read more like a concise report page.
      - Use with inspect_heading_slots(...) before applying extracted header text.
