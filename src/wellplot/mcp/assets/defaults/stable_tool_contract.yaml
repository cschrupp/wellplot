version: 1
tools:
  - id: create_draft
    description: Create, clone, or save one logfile draft.
    mode: mutation
    operations: [create, clone, save]
    fields:
      source_logfile_path: string
      yaml_text: string
      kind: string
      overwrite: boolean
  - id: inspect_authoring
    description: Inspect scoped canonical authoring objects. detail=summary is the compact default; detail=full returns complete selected objects.
    mode: inspection
    read_only: true
    idempotent: true
    required: [logfile_path, object_kind]
    fields:
      logfile_path: string
      object_kind: [page, depth, header_slot, service_title, section, track, curve_binding, raster_binding, annotation, fill, remark]
      section_id: string
      track_id: string
      detail: [summary, full]
  - id: inspect_source
    description: Inspect source metadata and available channels. include_metadata=false returns a compact channel summary; true includes full well metadata and provenance.
    mode: inspection
    read_only: true
    idempotent: true
    open_world: true
    fields:
      logfile_path: string
      source_path: string
      source_format: string
      section_id: string
      channels: string_list
      include_metadata: boolean
  - id: inspect_vocab
    description: Inspect supported vocabulary. family selects one object family; detail=summary is compact and detail=full returns the selected catalog payload.
    mode: inspection
    read_only: true
    idempotent: true
    fields:
      family: string
      detail: [summary, full]
  - id: edit_header
    description: Fill header slots and service titles without replacing the archetype. Use operation=apply_values with the values mapping for bulk or natural-language header assignments; slot_id is required only for set_slot and clear_slot.
    mode: mutation
    operations: [set_slot, set_service_title, apply_archetype, apply_values, clear_slot]
    canonical_fields: header
    fields:
      logfile_path: string
      slot_id: string
      service_title: string
      archetype_id: string
      values: object
      preserve_existing_values: boolean
      overwrite_policy: string
  - id: edit_report_settings
    description: 'Update report, page, output, depth, section view, or report-wide Matplotlib style. For set_section_view, depth_range must be an object with numeric minimum and maximum and optional unit, for example {minimum: 25, maximum: 4845, unit: ft}.'
    mode: mutation
    operations: [set_report, set_page, set_output, set_depth, set_section_view, set_matplotlib_style]
    operation_variants:
      set_report:
        any_required: [title, subtitle]
      set_page:
        required: [page]
      set_output:
        required: [output]
      set_depth:
        required: [depth]
      set_section_view:
        required: [section_id]
        any_required: [title, subtitle, depth_range, page, output]
      set_matplotlib_style:
        required: [style_patch]
    fields:
      section_id: string
      title: string
      subtitle: string
      page: object
      output: object
      depth:
        type: object
        additionalProperties: false
        properties:
          unit:
            type: string
          scale:
            oneOf:
              - type: string
              - type: number
          major_step: number
          minor_step: number
      depth_range:
        type: object
        additionalProperties: false
        required: [minimum, maximum]
        properties:
          minimum: number
          maximum: number
          unit:
            type: string
            minLength: 1
      style_patch: object
  - id: edit_remarks
    description: 'Remarks operations: add=remark{title,text,lines,alignment}; add requires actual content in non-empty remark.text or at least one item in remark.lines; title/alignment alone is invalid. update=remark_id+patch; remove/move=remark_id; clear=all.'
    mode: mutation
    operations: [add, update, remove, move, clear]
    destructive: true
    fields:
      remark_id: string
      new_index: index
      remark: object
      patch: object
  - id: edit_section
    description: 'Create, update, remove, or move one report section. For operation=update, depth_range must be an object with numeric minimum and maximum and optional unit, for example {minimum: 25, maximum: 4845, unit: ft}. For operation=add, section must be a complete section object with a non-empty tracks list; to clone an existing section structure, use replicate_section_structure instead.'
    mode: mutation
    operations: [add, update, remove, move]
    destructive: true
    fields:
      section_id: string
      new_index: index
      section: object
      title: string
      subtitle: string
      depth_range:
        type: object
        additionalProperties: false
        required: [minimum, maximum]
        properties:
          minimum: number
          maximum: number
          unit:
            type: string
            minLength: 1
  - id: replicate_section_structure
    description: 'Copy one existing section''s validated track structure to a new section, optionally with bindings and a new source. Use this for multi-section packets instead of synthesizing a section object without tracks. The operation is retry-safe: an equivalent existing target returns a successful no-op with already_exists=true and a stable source-to-target id_map; a conflicting target fails unless overwrite=true.'
    mode: mutation
    operations: [replicate]
    fields:
      source_section_id: string
      target_section_id: string
      source_path: string
      source_format: string
      title: string
      subtitle: string
      include_bindings: boolean
      overwrite: boolean
  - id: edit_track
    description: 'Create or edit one track. Required call shapes: operation=add requires section_id, track_id, title, kind, and width_mm in the same call; operation=set_scales requires section_id, track_id, and at least one of x_scale, curve_scale, or channel_scales. Never call set_scales without a scale payload. section_id and track_id are required for every operation. Add appends the track, then use operation=move for placement. A retry of an equivalent add is a successful no-op; an add with conflicting properties must use operation=update. Track x_scale is the shared horizontal axis/grid scale for normal and array tracks; curve binding scale is independent content scale. Array raster presentation belongs on edit_raster_binding fields such as profile, colorbar, sample_axis, and color_limits. Use set_scales only when both track and curve scales are intentionally synchronized; otherwise use update with x_scale or edit_curve_binding with scale. For update, remove, move, and clear_bindings, track_id must already exist.'
    mode: mutation
    operations: [add, update, remove, move, clear_bindings, set_scales]
    canonical_fields: track
    destructive: true
    required: [section_id, track_id]
    operation_variants:
      add:
        required: [title, kind, width_mm]
      move:
        required: [new_index]
      set_scales:
        any_required: [x_scale, curve_scale, channel_scales]
    fields:
      section_id: string
      track_id: string
      kind: [normal, reference, array, annotation]
      grid: object
      new_index: index
      title: string
      width_mm: number
      x_scale: object
      curve_scale: object
      channel_scales: object
      sync_grid_to_scale: boolean
      reference: object
      track_header: object
      annotations: object_list
  - id: edit_curve_binding
    description: Add, update, remove, or clear scalar curve bindings. Every operation requires section_id and track_id. Add requires channel. Update and remove require either channel or the binding_id of an existing binding; the service resolves channel from binding_id when channel is omitted. Clear removes all scalar bindings from the track and needs neither channel nor binding_id. Trust a successful mutation result and do not immediately repeat the same add. A retry of an equivalent add with the same binding_id is a successful no-op; to add another instance of a channel already on the track, provide a new distinct binding_id; an add without one is rejected. Use operation=update when changing an existing binding. Correct a failed mutation and retry it before reporting completion.
    mode: mutation
    operations: [add, update, remove, clear]
    canonical_fields: curve
    destructive: true
    required: [section_id, track_id]
    operation_variants:
      add:
        required: [channel]
      update:
        any_required: [channel, binding_id]
      remove:
        any_required: [channel, binding_id]
    fields:
      section_id: string
      track_id: string
      binding_id: string
      channel: string
      label: string
      style: object
      scale: object
      header_display: object
      wrap: boolean
      render_mode: [line, value_labels]
  - id: edit_raster_binding
    description: Add, update, remove, or clear array/raster bindings. Every operation requires section_id and track_id. Add requires channel. Update and remove require either channel or the binding_id of an existing binding; the service resolves channel from binding_id when channel is omitted. Clear removes all raster bindings from the track and needs neither channel nor binding_id. Optional nested strings such as sample_axis.label and sample_axis.unit must be non-empty when supplied; omit them when no value is requested. Correct a failed mutation and retry it before reporting completion.
    mode: mutation
    operations: [add, update, remove, clear]
    canonical_fields: raster
    destructive: true
    required: [section_id, track_id]
    operation_variants:
      add:
        required: [channel]
      update:
        any_required: [channel, binding_id]
      remove:
        any_required: [channel, binding_id]
    fields:
      section_id: string
      track_id: string
      binding_id: string
      channel: string
      label: string
      style: object
      profile: string
      normalization: string
      waveform_normalization: string
      clip_percentiles: object
      interpolation: string
      show_raster: boolean
      alpha: number
      color_limits: object
      colorbar: object
      sample_axis: object
      waveform: object
  - id: edit_fill
    description: Add, update, remove, or clear a fill relation. section_id, track_id, and channel are required for every operation; add and update also require kind.
    mode: mutation
    operations: [add, update, remove, clear]
    destructive: true
    required: [section_id, track_id, channel]
    fields:
      section_id: string
      track_id: string
      fill_id: string
      binding_id: string
      other_binding_id: string
      kind: [between_curves, between_instances, baseline_split]
      label: string
      color: string
      alpha: number
      crossover: object
      channel: string
  - id: edit_annotation
    description: Add, update, remove, or clear typed annotations.
    mode: mutation
    operations: [add, update, remove, clear]
    destructive: true
    fields:
      section_id: string
      track_id: string
      annotation_id: string
      kind: [interval, text, marker, arrow, glyph]
      depth: number
      top: number
      base: number
      text: string
      label: string
      glyph: string
      color: string
      annotation: object
      patch: object
  - id: validate_logfile
    description: Validate a persisted logfile at the requested tier and return actionable errors.
    mode: validation
    read_only: true
    idempotent: true
    required: [logfile_path]
    fields:
      logfile_path: string
      level: [structural, data, render]
  - id: preview_logfile
    description: Render a scoped preview for visual verification.
    mode: artifact
    read_only: true
    idempotent: true
    required: [logfile_path]
    fields:
      logfile_path: string
      focus: string
      section_id: string
      track_id: string
      page: index
  - id: render_logfile
    description: Render a validated logfile to its configured artifact.
    mode: artifact
    destructive: true
    required: [logfile_path]
    fields:
      logfile_path: string
      output_path: string
      overwrite: boolean
