render:
  backend: matplotlib
  dpi: 144
  continuous_strip_page_height_mm: 297
  matplotlib:
    style:
      report:
        summary_label_fontsize: 8.0
        summary_value_fontsize: 10.5
        provider_fontsize: 16.0
        service_fontsize: 8.0
        tail_service_fontsize: 8.0
        field_label_fontsize: 7.0
        field_value_fontsize: 7.8
        detail_header_fontsize: 9.0
        detail_label_fontsize: 6.4
        detail_value_fontsize: 6.4
        tail_frame_y: 0.74
        tail_frame_height: 0.22
      section_title:
        background_color: '#0d3fb3'
        border_mode: box
        border_color: '#0d3fb3'
        border_linewidth: 0.8
        padding_left: 0.03
        padding_right: 0.03
        title_align: center
        subtitle_align: center
        title_fontsize: 11.0
        subtitle_fontsize: 6.6
        title_color: '#ffffff'
        subtitle_color: '#eaf0ff'
        title_y: 0.68
        subtitle_y: 0.22
      track_header:
        background_color: '#eef2f8'
      track:
        x_tick_labelsize: 6.0
      grid:
        depth_major_linewidth: 0.65
document:
  page:
    size: A4
    orientation: portrait
    continuous: false
    bottom_track_header_enabled: true
    margin_left_mm: 0
    margin_right_mm: 8
    margin_top_mm: 0
    margin_bottom_mm: 0
    track_gap_mm: 0
    header_height_mm: 0
    track_header_height_mm: 30
    footer_height_mm: 0
  depth:
    unit: ft
    scale: 240
    major_step: 10
    minor_step: 2
  layout:
    heading:
      enabled: true
      provider_name: Company
      general_fields:
      - key: archive_no
        label: Archive No.
        value: ''
      - key: api_no
        label: API No.
        value: ''
      - key: version
        label: Version
        value: ''
      - key: company
        label: Company
        source_key: COMP
      - key: well
        label: Well
        source_key: WELL
      - key: field
        label: Field
        source_key: FLD
      - key: county
        label: County
        source_key: CNTY
      - key: country
        label: Country
        aliases:
          - State
          - State / Country
        source_key: CTRY
      - key: location
        label: Location
        source_key: LOC
      - key: section
        label: Section
        value: ''
      - key: township
        label: Township
        value: ''
      - key: range
        label: Range
        value: ''
      - key: footage
        label: Footage
        value: ''
      - key: latitude
